name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check
        run: ./gradlew spotlessCheck :shared:desktopTest :androidApp:testPlayDebugUnitTest :androidApp:testFossDebugUnitTest :androidApp:assembleDebug :desktopApp:compileKotlin
